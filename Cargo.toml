[package]
name = "mini-ai-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.13", features = ["json"]}
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
